<!DOCTYPE html>
<html lang="en" class="sa-static">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Health â€” Doctors My Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dma-design-system.css?v=48" />
  <link rel="stylesheet" href="/superadmin-theme.css?v=12" />
  <style>
    .health-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.5rem; }
    @media(max-width:900px){ .health-grid{grid-template-columns:1fr 1fr;} }
    @media(max-width:560px){ .health-grid{grid-template-columns:1fr;} }
    .health-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:1.25rem; display:flex; align-items:center; gap:1rem; }
    .health-icon { width:48px; height:48px; border-radius:var(--r-lg); display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
    .health-label { font-size:.67rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
    .health-value { font-family:'Montserrat',sans-serif; font-size:1.25rem; font-weight:800; color:var(--text-1); margin:0; line-height:1; }
    .health-status { font-size:.72rem; font-weight:700; margin:4px 0 0; }
    .ok { color:#16A34A; } .warn { color:#D97706; } .err { color:#DC2626; }

    .check-list-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); overflow:hidden; margin-bottom:1.25rem; }
    .check-item { display:flex; align-items:center; gap:1rem; padding:.875rem 1.25rem; border-bottom:1px solid var(--border); }
    .check-item:last-child { border-bottom:none; }
    .check-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .check-dot.ok { background:#16A34A; } .check-dot.warn { background:#D97706; } .check-dot.err { background:#DC2626; } .check-dot.loading { background:#CBD5E1; } .check-dot.unknown { background:#94A3B8; }
    .check-name { flex:1; font-size:var(--f-sm); font-weight:600; color:var(--text-2); }
    .check-val { font-size:var(--f-sm); font-weight:700; color:var(--text-1); }
    .check-desc { font-size:.72rem; color:var(--muted); }

    .log-block { background:var(--sidebar-bg,#0F172A); color:#E2EAF4; border-radius:var(--r-lg); padding:1.25rem; font-family:'Courier New',monospace; font-size:.78rem; line-height:1.7; max-height:340px; overflow-y:auto; margin-top:1rem; white-space:pre-wrap; }
  </style>
</head>
<body class="superadmin-app">
  <div class="sa-layout">
    <aside class="sa-sidebar" id="sa-sidebar"></aside>
    <main class="sa-main">
      <div class="sa-content-card">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem">
          <div>
            <h1>System Health</h1>
            <p class="sa-subtitle">Real-time status of all platform services, APIs, and infrastructure.</p>
          </div>
          <div style="display:flex;gap:.625rem;align-items:center">
            <span id="last-checked" style="font-size:.72rem;color:var(--muted)">Checkingâ€¦</span>
            <button type="button" class="ds-btn ds-btn-primary" onclick="runChecks()">Refresh</button>
          </div>
        </div>

        <!-- Stat cards -->
        <div class="health-grid" id="health-stats">
          <div class="health-card"><div class="health-icon" style="background:rgba(37,99,235,.1)">ðŸš€</div><div><p class="health-label">API</p><p class="health-value" id="api-status">â€”</p><p class="health-status" id="api-ms"></p></div></div>
          <div class="health-card"><div class="health-icon" style="background:rgba(22,163,74,.1)">ðŸ—„ï¸</div><div><p class="health-label">Database</p><p class="health-value" id="db-status">â€”</p><p class="health-status" id="db-detail"></p></div></div>
          <div class="health-card"><div class="health-icon" style="background:rgba(217,119,6,.1)">âœ‰ï¸</div><div><p class="health-label">Email / SMTP</p><p class="health-value" id="smtp-status">â€”</p><p class="health-status" id="smtp-detail"></p></div></div>
          <div class="health-card"><div class="health-icon" style="background:rgba(34,197,94,.1)">ðŸ’¬</div><div><p class="health-label">WhatsApp API</p><p class="health-value" id="wa-status">â€”</p><p class="health-status" id="wa-detail"></p></div></div>
          <div class="health-card"><div class="health-icon" style="background:rgba(124,58,237,.1)">ðŸ¤–</div><div><p class="health-label">AI Provider</p><p class="health-value" id="ai-status">â€”</p><p class="health-status" id="ai-detail"></p></div></div>
          <div class="health-card"><div class="health-icon" style="background:rgba(249,115,22,.1)">ðŸ’³</div><div><p class="health-label">Stripe</p><p class="health-value" id="stripe-status">â€”</p><p class="health-status" id="stripe-detail"></p></div></div>
        </div>

        <!-- Checklist -->
        <div class="check-list-card">
          <div style="padding:.875rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface-2)">
            <p style="font-size:var(--f-sm);font-weight:800;color:var(--text-1);margin:0">Service Checklist</p>
          </div>
          <div id="checklist"></div>
        </div>

        <!-- Recent logs -->
        <div>
          <button type="button" class="ds-btn ds-btn-outline" id="toggle-logs">View startup logs</button>
          <div class="ds-log" id="log-wrap"><div class="log-block" id="startup-log">Loading startup logâ€¦</div></div>
        </div>
      </div>
    </main>
  </div>
  <script src="/superadmin-admin-shell.js?v=17"></script>
  <script src="/dma-ui.js?v=8"></script>
  <script>
  (function () {
    if (!DmaAdminShell.initStaticPage('/superadmin/health/')) return;

    function safe(val, fallback) {
      if (window.DmaUI && typeof DmaUI.display === 'function') return DmaUI.display(val, fallback);
      if (val == null || val === '' || val === 'undefined' || val === 'null') return fallback || 'Unavailable';
      if (typeof val === 'number' && !isFinite(val)) return fallback || 'Unavailable';
      if (typeof val === 'object') return fallback || 'Unavailable';
      return String(val);
    }

    function setStatus(id, text, cls) {
      var el = document.getElementById(id);
      if (el) { el.textContent = text; el.className = 'health-status ' + (cls || ''); }
    }

    function setValue(id, text) {
      var el = document.getElementById(id);
      if (el) el.textContent = safe(text, 'â€”');
    }

    function addCheck(name, status, value, description) {
      var list = document.getElementById('checklist');
      var div = document.createElement('div');
      div.className = 'check-item';
      div.innerHTML =
        '<span class="check-dot ' + status + '"></span>' +
        '<span class="check-name">' + name + '<br><span class="check-desc">' + safe(description, '') + '</span></span>' +
        '<span class="check-val">' + safe(value, 'Unavailable') + '</span>';
      list.appendChild(div);
    }

    function clinicCountLabel(n) {
      if (typeof n !== 'number' || !isFinite(n)) return 'Unavailable';
      return n === 1 ? '1 clinic' : n + ' clinics';
    }

    function waClinicLabel(n) {
      if (typeof n !== 'number' || !isFinite(n)) return 'Unavailable';
      if (n <= 0) return 'Not connected';
      return n === 1 ? 'Connected â€” 1 clinic' : 'Connected â€” ' + n + ' clinics';
    }

    function fieldCountLabel(configured, total) {
      if (typeof configured !== 'number' || typeof total !== 'number') return 'Not configured';
      return configured + '/' + total + ' fields';
    }

    window.runChecks = function () {
      document.getElementById('checklist').innerHTML = '';
      document.getElementById('last-checked').textContent = 'Checkingâ€¦';

      // Public same-origin API. Never call 127.0.0.1 / localhost / :3002 from the browser.
      var t0 = Date.now();
      fetch('/api/health', { credentials: 'include', cache: 'no-store' })
        .then(function (r) {
          var ct = (r.headers.get('content-type') || '').toLowerCase();
          if (ct.indexOf('application/json') === -1) throw new Error('not-json');
          return r.json().then(function (d) { return { httpOk: r.ok, d: d || {} }; });
        })
        .then(function (res) {
          var ms = Date.now() - t0;
          var d = res.d;
          if (d.ok === true) {
            setValue('api-status', 'âœ“ Online');
            setStatus('api-ms', ms + 'ms response', 'ok');
            addCheck('API Server', 'ok', ms + 'ms', safe(d.service, 'Doctors My Agency API'));
          } else if (res.httpOk) {
            setValue('api-status', 'âš  Degraded');
            setStatus('api-ms', ms + 'ms Â· unexpected payload', 'warn');
            addCheck('API Server', 'warn', 'Degraded', 'Health payload did not report ok');
          } else {
            setValue('api-status', 'âœ— Offline');
            setStatus('api-ms', 'Not reachable', 'err');
            addCheck('API Server', 'err', 'Unreachable', 'Same-origin /api/health failed');
          }
        })
        .catch(function () {
          setValue('api-status', 'âœ— Offline');
          setStatus('api-ms', 'Not reachable', 'err');
          addCheck('API Server', 'err', 'Unreachable', 'Same-origin /api/health is not JSON');
        });

      DmaAdminShell.api('/api/health/db')
        .then(function (d) {
          d = d || {};
          if (d.ok) {
            var clinics = clinicCountLabel(d.clinic_count);
            setValue('db-status', 'âœ“ Online');
            setStatus('db-detail', clinics === 'Unavailable' ? 'Connected' : clinics, 'ok');
            addCheck('MySQL Database', 'ok', clinics === 'Unavailable' ? 'Connected' : clinics, 'Database reachable');
          } else {
            setValue('db-status', 'âœ— Error');
            setStatus('db-detail', safe(d.code, 'Unavailable'), 'err');
            addCheck('MySQL Database', 'err', 'Unavailable', safe(d.error, 'Connection failed'));
          }
        }).catch(function () {
          setValue('db-status', 'Unknown');
          setStatus('db-detail', 'Unavailable', 'warn');
          addCheck('MySQL Database', 'unknown', 'Unavailable', 'Secondary diagnostic failed â€” API may still be online');
        });

      DmaAdminShell.api('/api/superadmin/integrations')
        .then(function (d) {
          var groups = (d && d.groups) || {};

          var email = groups.email || {};
          if (email.status === 'ready') {
            var smtpHost = '';
            if (Array.isArray(email.fields)) {
              email.fields.forEach(function (f) {
                if (f && f.key === 'SMTP_HOST' && f.value) smtpHost = f.value;
              });
            }
            setValue('smtp-status', 'âœ“ Configured');
            setStatus('smtp-detail', safe(smtpHost, 'Ready'), 'ok');
            addCheck('SMTP Email', 'ok', 'Ready', 'Outbound email configured');
          } else {
            setValue('smtp-status', 'âš  Partial');
            setStatus('smtp-detail', 'Check Integrations', 'warn');
            addCheck('SMTP Email', 'warn', 'Needs configuration', 'Set SMTP credentials in Integrations');
          }

          var ai = groups.ai || {};
          if (ai.status === 'ready') {
            setValue('ai-status', 'âœ“ Active');
            setStatus('ai-detail', 'Provider ready', 'ok');
            addCheck('AI Receptionist', 'ok', 'Active', 'AI provider configured');
          } else {
            setValue('ai-status', 'Not configured');
            setStatus('ai-detail', 'API key missing', 'warn');
            addCheck('AI Receptionist', 'warn', 'Not configured', 'Set DEEPSEEK_API_KEY in Integrations');
          }

          var meta = groups.meta || {};
          if (meta.status === 'ready') {
            setValue('wa-status', 'âœ“ Configured');
            setStatus('wa-detail', 'Meta Cloud API', 'ok');
            addCheck('Meta WhatsApp API', 'ok', 'Configured', 'App ID and credentials set');
          } else {
            setValue('wa-status', 'Not configured');
            setStatus('wa-detail', 'Check config', 'warn');
            addCheck('Meta WhatsApp API', 'warn', fieldCountLabel(meta.configured, meta.total), 'Configure in Integrations');
          }

          var stripe = groups.stripe || {};
          if (stripe.status === 'ready') {
            setValue('stripe-status', 'âœ“ Connected');
            setStatus('stripe-detail', 'Keys set', 'ok');
            addCheck('Stripe Billing', 'ok', 'Connected', 'Subscription billing active');
          } else {
            setValue('stripe-status', 'Not configured');
            setStatus('stripe-detail', 'Trial only mode', 'warn');
            addCheck('Stripe Billing', 'warn', 'Not configured', 'Clinics stay on free trial without Stripe');
          }
        }).catch(function () {
          ['smtp-status','ai-status','wa-status','stripe-status'].forEach(function(id){
            setValue(id, 'Unknown');
          });
          setStatus('smtp-detail', 'Unavailable', 'warn');
          setStatus('ai-detail', 'Unavailable', 'warn');
          setStatus('wa-detail', 'Unavailable', 'warn');
          setStatus('stripe-detail', 'Unavailable', 'warn');
          addCheck('Integrations', 'unknown', 'Unavailable', 'Secondary diagnostic failed â€” does not mean the API is offline');
        });

      fetch('/api/webhooks/meta?probe=1', { credentials: 'include', cache: 'no-store' })
        .then(function (r) {
          var ct = (r.headers.get('content-type') || '').toLowerCase();
          if (ct.indexOf('application/json') === -1) throw new Error('not-json');
          return r.json();
        })
        .then(function (d) {
          d = d || {};
          var label = waClinicLabel(d.connectedClinics);
          addCheck('Meta Webhook', label === 'Unavailable' ? 'unknown' : 'ok', label, 'Webhook URL reachable at /api/webhooks/meta');
        })
        .catch(function () {
          addCheck('Meta Webhook', 'unknown', 'Unavailable', 'Webhook probe failed â€” this is not API downtime');
        });

      document.getElementById('last-checked').textContent = 'Last checked: ' + new Date().toLocaleTimeString();
    };

    // Load startup log
    fetch('/clinicos-api/logs/startup.log')
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var lines = t.trim().split('\n').slice(-40).join('\n');
        document.getElementById('startup-log').textContent = lines || '(empty)';
      })
      .catch(function () {
        document.getElementById('startup-log').textContent = 'Log not accessible from browser (server-side file).\nCheck clinicos-api/logs/startup.log on the server.';
      });

    var toggleLogs = document.getElementById('toggle-logs');
    if (toggleLogs) {
      toggleLogs.onclick = function () {
        var wrap = document.getElementById('log-wrap');
        var open = wrap.classList.toggle('open');
        toggleLogs.textContent = open ? 'Hide startup logs' : 'View startup logs';
      };
    }

    runChecks();
    setTimeout(runChecks, 30000); // auto-refresh every 30s
  })();
  </script>
</body>
</html>
