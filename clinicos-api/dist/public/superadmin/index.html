<!DOCTYPE html>
<html lang="en" class="sa-static">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Overview — Doctors My Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dma-design-system.css?v=8" />
  <link rel="stylesheet" href="/superadmin-theme.css?v=10" />
</head>
<body class="superadmin-app">
  <div class="sa-layout">
    <aside class="sa-sidebar" id="sa-sidebar"></aside>
    <main class="sa-main">
      <div class="sa-content-card">
        <div class="ds-page-header">
          <div>
            <h1>Platform overview</h1>
            <p>Live clinics, usage, and the work that needs attention.</p>
          </div>
          <a class="ds-btn ds-btn-primary" href="/superadmin/clinics/">Open clinics</a>
        </div>
        <div id="kpis" class="ds-kpis"><div class="ds-loading">Loading metrics…</div></div>
        <div class="dma-grid-2" style="display:grid;grid-template-columns:1.4fr .8fr;gap:16px">
          <section class="sa-section-card" style="padding:16px">
            <h2 class="ds-card-title" style="margin:0 0 12px;font-size:0.9375rem">Recent signups</h2>
            <div id="signups" class="ds-loading">Loading…</div>
          </section>
          <section class="sa-section-card" style="padding:16px">
            <h2 style="margin:0 0 12px;font-size:0.9375rem">System</h2>
            <div id="health" class="ds-loading">Checking health…</div>
            <p style="margin:16px 0 0"><a class="ds-btn ds-btn-outline ds-btn-sm" href="/superadmin/health/">Health console</a>
            <a class="ds-btn ds-btn-outline ds-btn-sm" href="/superadmin/audit/">Audit log</a></p>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script src="/superadmin-admin-shell.js?v=8"></script>
  <script src="/dma-ui.js?v=1"></script>
  <script>
    (function () {
      if (!DmaAdminShell.initStaticPage('/superadmin/')) return;
      var esc = DmaUI.esc;
      Promise.all([
        DmaAdminShell.api('/api/superadmin/stats'),
        DmaAdminShell.api('/api/superadmin/health').catch(function () { return null; })
      ]).then(function (parts) {
        var s = parts[0] || {};
        var h = parts[1] || {};
        var items = [
          { l: 'Clinics', v: s.totalClinics, sub: (s.activeClinics || 0) + ' active' },
          { l: 'Patients', v: s.totalPatients, sub: 'platform-wide' },
          { l: 'Appointments', v: s.totalAppointments, sub: 'all time' },
          { l: 'Est. MRR', v: '$' + (s.mrr || 0), sub: (s.newThisMonth || 0) + ' new this month' }
        ];
        document.getElementById('kpis').innerHTML = items.map(function (k) {
          return '<div class="ds-kpi"><div><label>' + k.l + '</label><strong>' + esc(k.v != null ? k.v : '—') + '</strong><span class="sub" style="color:var(--ds-muted);font-size:0.75rem">' + k.sub + '</span></div></div>';
        }).join('');
        var signups = s.recentSignups || [];
        document.getElementById('signups').innerHTML = signups.length
          ? '<table class="ds-table"><thead><tr><th>Clinic</th><th>Owner</th><th>Plan</th></tr></thead><tbody>' +
            signups.map(function (c) {
              return '<tr data-href="/superadmin/clinics/' + encodeURIComponent(c.id) + '/" style="cursor:pointer"><td><strong>' + esc(c.name) + '</strong></td><td>' + esc(c.ownerName || '—') + '</td><td>' + esc(c.plan || '—') + '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<p class="ds-empty">No recent signups.</p>';
        document.getElementById('signups').onclick = function (e) {
          var tr = e.target.closest('tr[data-href]');
          if (tr) location.href = tr.getAttribute('data-href');
        };
        var db = h.database === 'unavailable' ? 'Database issue' : 'Database reachable';
        var wa = h.whatsappConnections != null ? h.whatsappConnections + ' WhatsApp connections' : 'See Health for WhatsApp';
        document.getElementById('health').innerHTML = '<p class="cos-hint" style="margin:0">' + esc(db) + '<br>' + esc(wa) + '</p>';
      }).catch(function (err) {
        document.getElementById('kpis').innerHTML = '<div class="ds-error">' + esc(err.message || 'Could not load overview.') + '</div>';
      });
    })();
  </script>
</body>
</html>
