<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14967F">
<title>Hours — Clinicos</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/os.css?v=1">
<link rel="stylesheet" href="/assets/os-register.css?v=1">
<script src="/api-shim.js"></script>
<script>document.documentElement.setAttribute('data-theme','light');</script>
</head>
<body>
<div class="au">
  <div class="lp">
    <i class="blob" style="width:380px;height:380px;background:#BDEBDD;left:-80px;top:-60px"></i>
    <i class="blob" style="width:320px;height:320px;background:#CFE2FA;right:-60px;bottom:40px;animation-delay:-4s"></i>
    <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.2-6 4 12 2.2-6H21"/></svg></span><span><b>Doctors My Agency</b><small>Clinicos</small></span></a>
    <div>
      <h2>When are you open?</h2>
      <p class="lede" style="margin-bottom:24px">You can change this later in Settings.</p>
      <svg viewBox="0 0 400 80" width="100%" height="70" aria-hidden="true"><path class="ecg" d="M0 44h120l16-34 24 66 18-42 14 10h208" fill="none" stroke="#14967F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="xs mut">© Clinicos · Doctors My Agency · 2026</div>
  </div>
  <div class="ra">
    <div class="fm reg-fm-wide">
      <div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
      <div class="xs mut b" style="margin-bottom:6px">Step 3 of 4</div>
      <h1>Hours</h1>
      <p class="mut">Opening hours for booking and the AI receptionist.</p>
      <div id="error" class="reg-alert err" style="display:none" role="alert"></div>
      <div id="hoursList" class="reg-hours"></div>
      <div class="row" style="margin-top:8px;gap:10px;flex-wrap:wrap">
        <a class="btn gh lg" href="/register/clinic/">Back</a>
        <button type="button" class="btn gh lg" id="skipBtn">Skip</button>
        <button type="button" class="btn pri lg sp" id="saveBtn">Continue</button>
      </div>
    </div>
  </div>
</div>
<script src="/portal.js?v=9"></script>
<script src="/assets/os-register.js?v=1"></script>
<script>
if (!OsRegister.requireToken('/register/')) throw new Error('auth');

var DAYS = [
  ['monday','Mon'], ['tuesday','Tue'], ['wednesday','Wed'], ['thursday','Thu'],
  ['friday','Fri'], ['saturday','Sat'], ['sunday','Sun'],
];
var DEFAULT = {
  monday: { isOpen: true, open: '09:00', close: '17:00', slotDuration: 30 },
  tuesday: { isOpen: true, open: '09:00', close: '17:00', slotDuration: 30 },
  wednesday: { isOpen: true, open: '09:00', close: '17:00', slotDuration: 30 },
  thursday: { isOpen: true, open: '09:00', close: '17:00', slotDuration: 30 },
  friday: { isOpen: true, open: '09:00', close: '17:00', slotDuration: 30 },
  saturday: { isOpen: false, open: '09:00', close: '17:00', slotDuration: 30 },
  sunday: { isOpen: false, open: '09:00', close: '17:00', slotDuration: 30 },
};
var hours = JSON.parse(JSON.stringify(DEFAULT));
var list = document.getElementById('hoursList');

function timeOptions() {
  var o = [];
  for (var h = 6; h <= 22; h++) {
    ['00', '30'].forEach(function (m) { o.push(String(h).padStart(2, '0') + ':' + m); });
  }
  return o;
}
var times = timeOptions();

function toggleHtml(on, key) {
  return '<span class="sw ' + (on ? 'on' : '') + '" role="switch" tabindex="0" aria-checked="' + !!on + '" data-sw-day="' + key + '"></span>';
}

DAYS.forEach(function (pair) {
  var key = pair[0], label = pair[1];
  var row = document.createElement('div');
  row.className = 'reg-hours-row';
  row.innerHTML =
    '<span class="day">' + label + '</span>' +
    toggleHtml(hours[key].isOpen, key) +
    '<select class="sel sel-open" data-open="' + key + '">' + times.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') + '</select>' +
    '<span class="sep">to</span>' +
    '<select class="sel sel-close" data-close="' + key + '">' + times.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') + '</select>';
  list.appendChild(row);
  row.querySelector('[data-open="' + key + '"]').value = hours[key].open;
  row.querySelector('[data-close="' + key + '"]').value = hours[key].close;
});

list.addEventListener('click', function (e) {
  var sw = e.target.closest('[data-sw-day]');
  if (!sw) return;
  sw.classList.toggle('on');
  sw.setAttribute('aria-checked', sw.classList.contains('on'));
});

function collect() {
  DAYS.forEach(function (pair) {
    var key = pair[0];
    var row = list.querySelector('[data-open="' + key + '"]').closest('.reg-hours-row');
    var sw = row.querySelector('[data-sw-day]');
    hours[key].isOpen = sw.classList.contains('on');
    hours[key].open = row.querySelector('[data-open="' + key + '"]').value;
    hours[key].close = row.querySelector('[data-close="' + key + '"]').value;
  });
  return hours;
}

function goNext() { location.href = '/register/plan/'; }

function formatApiError(data, fallback) {
  if (data.details && Array.isArray(data.details)) {
    return data.details.map(function (d) { return d.message || (d.path && d.path.join('.')); }).filter(Boolean).join(' · ') || fallback;
  }
  return data.error || data.message || fallback;
}

async function saveHours(hoursData) {
  var r = await fetch('/api/settings/hours', {
    method: 'PATCH',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + localStorage.getItem('token'),
    },
    credentials: 'include',
    body: JSON.stringify({ workingHours: JSON.stringify(hoursData) }),
  });
  var data = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(formatApiError(data, 'Could not save working hours'));
}

async function handleSave(useDefaults) {
  var err = document.getElementById('error');
  var saveBtn = document.getElementById('saveBtn');
  var skipBtn = document.getElementById('skipBtn');
  var activeBtn = useDefaults ? skipBtn : saveBtn;
  err.style.display = 'none';
  setBtnLoading(activeBtn, true, useDefaults ? 'Skipping…' : 'Saving…');
  if (saveBtn !== activeBtn) saveBtn.disabled = true;
  if (skipBtn !== activeBtn) skipBtn.disabled = true;
  try {
    var payload = useDefaults ? JSON.parse(JSON.stringify(DEFAULT)) : collect();
    await saveHours(payload);
    goNext();
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = 'block';
    setBtnLoading(activeBtn, false);
    saveBtn.disabled = false;
    skipBtn.disabled = false;
  }
}

document.getElementById('skipBtn').onclick = function () { handleSave(true); };
document.getElementById('saveBtn').onclick = function () { handleSave(false); };
</script>
</body>
</html>
