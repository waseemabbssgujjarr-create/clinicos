<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14967F">
<title>Create account — Clinicos</title>
<link rel="icon" href="/favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/os.css?v=2">
<link rel="stylesheet" href="/assets/os-register.css?v=1">
<link rel="stylesheet" href="/assets/os-auth-live.css?v=1">
<script src="/api-shim.js"></script>
<script>document.documentElement.classList.add('os-live-auth');document.documentElement.setAttribute('data-theme','light');document.documentElement.style.colorScheme='light';</script>
</head>
<body data-area="public">
<div class="au">
  <div class="lp">
    <i class="blob" style="width:380px;height:380px;background:#BDEBDD;left:-80px;top:-60px"></i>
    <i class="blob" style="width:320px;height:320px;background:#CFE2FA;right:-60px;bottom:40px;animation-delay:-4s"></i>
    <a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.2-6 4 12 2.2-6H21"/></svg></span><span><b>Doctors My Agency</b><small>Clinicos</small></span></a>
    <div>
      <h2>Set up your clinic in minutes</h2>
      <p class="lede" style="margin-bottom:24px">14-day trial, no card to start.</p>
      <svg viewBox="0 0 400 80" width="100%" height="70" aria-hidden="true"><path class="ecg" d="M0 44h120l16-34 24 66 18-42 14 10h208" fill="none" stroke="#14967F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="xs mut">© Clinicos · Doctors My Agency · 2026</div>
  </div>
  <div class="ra">
    <div class="fm reg-fm-wide">
      <div class="steps"><i class="on"></i><i></i><i></i><i></i></div>
      <div class="xs mut b" style="margin-bottom:6px">Step 1 of 4</div>
      <h1>Create account</h1>
      <p class="mut">Owner and clinic basics.</p>
      <div id="error" class="reg-alert err" style="display:none" role="alert"></div>
      <div id="success" class="reg-alert ok" style="display:none" role="status"></div>
      <form id="form">
        <div class="field"><label for="ownerName">Your full name</label><input class="inp" id="ownerName" name="ownerName" type="text" required autocomplete="name" placeholder="Dr. Ahmed Rahman"></div>
        <div class="field"><label for="clinicName">Clinic name</label><input class="inp" id="clinicName" name="clinicName" type="text" required autocomplete="organization" placeholder="Rahman Dental Clinic"></div>
        <div class="grid g2" style="gap:0 14px">
          <div class="field"><label for="specialty">Specialty</label>
            <select class="sel" id="specialty" name="specialty">
              <option value="">Select…</option>
              <option value="general practice">General practice</option>
              <option value="dental">Dental &amp; aesthetics</option>
              <option value="dermatology">Dermatology</option>
              <option value="physiotherapy">Physiotherapy</option>
              <option value="pediatrics">Pediatrics</option>
              <option value="other">Specialist / other</option>
            </select>
          </div>
          <div class="field"><label for="phone">Phone</label><input class="inp" id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="+971 50 123 4567"></div>
        </div>
        <div class="field"><label for="email">Email</label><input class="inp" id="email" name="email" type="email" required autocomplete="email" placeholder="you@clinic.com"></div>
        <div class="field"><label for="password">Password</label>
          <div class="iw" style="position:relative">
            <input class="inp" id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" style="padding-right:48px">
            <button type="button" class="btn gh sm ic" data-showpw style="position:absolute;right:5px;top:5px" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="btn pri lg" style="width:100%;margin-top:8px" id="submitBtn">Continue</button>
      </form>
      <p class="sm mut tc" style="margin-top:18px">Already registered? <a class="b" style="color:var(--teal-d)" href="/doctor-login/">Log in</a></p>
      <p class="xs mut tc" style="margin-top:10px"><a href="/">← Home</a></p>
    </div>
  </div>
</div>
<script src="/portal.js?v=9"></script>
<script src="/assets/os-register.js?v=1"></script>
<script>
document.querySelector('[data-showpw]').addEventListener('click', function () {
  var inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  this.textContent = inp.type === 'password' ? 'Show' : 'Hide';
});
document.getElementById('form').onsubmit = async function (e) {
  e.preventDefault();
  var err = document.getElementById('error');
  var ok = document.getElementById('success');
  var btn = document.getElementById('submitBtn');
  err.style.display = 'none';
  ok.style.display = 'none';
  setBtnLoading(btn, true, 'Creating account…');
  var fd = new FormData(e.target);
  var payload = {
    ownerName: fd.get('ownerName'),
    clinicName: fd.get('clinicName'),
    specialty: fd.get('specialty') || undefined,
    phone: fd.get('phone'),
    email: fd.get('email'),
    password: fd.get('password'),
  };
  try {
    var r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload),
    });
    var data = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(data.error || data.message || 'Registration failed. Please try again.');
    var clinic = data.clinic || {};
    var user = data.user || {
      id: clinic.id,
      clinicId: clinic.id,
      role: 'DOCTOR',
      name: payload.ownerName,
      email: payload.email,
      clinicName: payload.clinicName,
      plan: clinic.plan || 'TRIAL',
      planStatus: clinic.planStatus || 'TRIALING',
      onboardingDone: false,
    };
    if (data.token && typeof syncClinicosStore === 'function') syncClinicosStore(user, data.token);
    if (data.email) {
      try {
        sessionStorage.setItem('dma-verify-email', data.email);
        sessionStorage.setItem('dma-verify-sent', data.verificationEmailSent === false ? '0' : '1');
      } catch (_) {}
    }
    if (data.requiresVerification) {
      ok.className = 'reg-alert ' + (data.verificationEmailSent === false ? 'warn' : 'ok');
      ok.textContent = (data.message || 'Check your email to verify your account.') + ' You can finish clinic setup now.';
      ok.style.display = 'block';
      setTimeout(function () { location.href = '/register/clinic/'; }, data.verificationEmailSent === false ? 2500 : 1800);
      return;
    }
    location.href = '/register/clinic/';
  } catch (ex) {
    var msg = String(ex.message || ex);
    err.textContent = msg === 'Failed to fetch'
      ? 'Could not reach the server. Confirm the API is running, then try again.'
      : msg;
    err.style.display = 'block';
  } finally {
    setBtnLoading(btn, false);
  }
};
</script>
</body>
</html>
