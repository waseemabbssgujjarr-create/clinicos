<!DOCTYPE html>
<html lang="en" class="dma-world-auth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff sign in — Clinicos</title>
  <link rel="icon" href="/media/landing/dma-insignia.png" type="image/png" />
  <link rel="stylesheet" href="/dma-design-system.css?v=57" />
</head>
<body>
  <div class="dma-auth">
    <aside class="dma-auth-visual">
      <a class="dma-pub-logo dma-pub-logo--lockup" href="/"><img class="dma-logo-mark" src="/media/landing/dma-insignia-white.png" alt="" width="36" height="36" /><span>Clinicos</span></a>
      <div>
        <h1>Your clinic, connected.</h1>
        <p>Front desk, waiting room and inbox — according to your role.</p>
      </div>
      <div class="dma-auth-preview"><strong>Staff portal</strong><p>Reception · Nurse · Assistant · Manager</p></div>
    </aside>
    <main class="dma-auth-form">
      <h2>Staff sign in</h2>
      <div class="dma-auth-roles">
        <a class="dma-chip" href="/doctor-login/">Doctor</a>
        <span class="dma-chip is-active">Staff</span>
      </div>
      <div id="error" class="dma-alert" style="display:none;margin-bottom:12px"></div>
      <form id="form">
        <div class="dma-field"><label>Work email</label><input type="email" name="email" required autocomplete="email"></div>
        <div class="dma-field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
        <p style="text-align:right"><a href="/forgot-password/">Forgot password?</a></p>
        <button type="submit" class="dma-btn dma-btn-primary">Sign In</button>
      </form>
      <p class="dma-hint" style="margin-top:20px">Invite only. <a href="/accept-invite/">Accept invite</a></p>
    </main>
  </div>
  <script src="/portal.js?v=8"></script>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const btn = e.target.querySelector('[type="submit"]');
      err.style.display = 'none';
      setBtnLoading(btn, true, 'Signing in…');
      const fd = new FormData(e.target);
      try {
        const r = await fetch('/api/auth/staff/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          if (data.code === 'EMAIL_NOT_VERIFIED') {
            err.innerHTML = data.error + ' <a href="/verify-email/?email=' + encodeURIComponent(fd.get('email')) + '">Resend link</a>';
            err.style.display = 'block';
            setBtnLoading(btn, false);
            return;
          }
          throw new Error(data.error || data.message || 'Sign in failed — check email and password');
        }
        if (data.token && data.user) syncClinicosStore(data.user, data.token);
        window.location.href = '/dashboard/';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
        setBtnLoading(btn, false);
      }
    };
  </script>
</body>
</html>
