<!DOCTYPE html>
<html lang="en" class="dma-world-auth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password — Doctors My Agency</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/dma-design-system.css?v=48" />
</head>
<body>
  <div class="dma-auth dma-auth-simple">
    <main class="dma-auth-form">
      <a class="dma-pub-logo" href="/"><span class="mark">DM</span> Doctors My Agency</a>
      <h2 style="margin-top:28px">Set a new password</h2>
      <p class="dma-hint">Choose a password you’ll use to sign in.</p>
      <div id="error" class="dma-alert" style="display:none;margin:12px 0"></div>
      <div id="success" class="dma-alert dma-alert-ok" style="display:none;margin:12px 0"></div>
      <form id="form">
        <input type="hidden" name="token" id="token" />
        <div class="dma-field"><label for="password">New password</label><input id="password" type="password" name="password" required minlength="8" autocomplete="new-password"></div>
        <div class="dma-field"><label for="confirm">Confirm password</label><input id="confirm" type="password" name="confirm" required minlength="8" autocomplete="new-password"></div>
        <button type="submit" class="dma-btn dma-btn-primary" style="width:100%;margin-top:8px">Update password</button>
      </form>
    </main>
  </div>
  <script src="/portal.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    document.getElementById('token').value = token || '';
    if (!token) {
      document.getElementById('error').textContent = 'This reset link is missing or invalid. Request a new one.';
      document.getElementById('error').style.display = 'block';
      document.getElementById('form').style.display = 'none';
    }
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const ok = document.getElementById('success');
      err.style.display = 'none';
      ok.style.display = 'none';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return;
      }
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Reset failed');
        var loginUrl = data.loginUrl || '/doctor-login/';
        ok.innerHTML = (data.message || 'Password updated.') + ' <a href="' + loginUrl + '">Sign in</a>';
        ok.style.display = 'block';
        e.target.style.display = 'none';
      } catch (ex) {
        err.textContent = ex.message;
        err.style.display = 'block';
      }
    };
  </script>
</body>
</html>
