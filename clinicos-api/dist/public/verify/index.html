<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Phone — Doctors My Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/landing.css" />
  <link rel="stylesheet" href="/portal.css" />
  <link rel="stylesheet" href="/platform-hovers.css" />
  <link rel="stylesheet" href="/dma-theme.css" />
  <script>
    (function(){try{var t=localStorage.getItem('dma-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(_){}})();
  </script>
</head>
<body class="portal-page">
  <div class="glow glow-purple"></div>
  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo" style="text-decoration:none;color:inherit"><div class="logo-icon">DM</div> Doctors My Agency</a>
    </div>
  </nav>
  <main class="portal-main">
    <div class="container">
      <a href="/my-appointments/" class="back-link">← Back to My Appointments</a>
      <div class="form-card" style="max-width:480px;margin:0 auto">
        <h1>Verify your identity</h1>
        <p class="subtitle" id="subtitle">Enter your phone number to receive a one-time code.</p>

        <div id="error" class="alert alert-error" style="display:none"></div>
        <div id="success" class="alert alert-success" style="display:none"></div>

        <form id="phone-form">
          <div class="field">
            <label>Phone number</label>
            <input type="tel" id="phone" name="phone" required placeholder="+971 50 123 4567" autocomplete="tel" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Send OTP →</button>
        </form>

        <form id="otp-form" style="display:none">
          <div class="field">
            <label>One-time code</label>
            <input type="text" id="otp" name="otp" required placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;letter-spacing:0.25em;font-size:1.25rem" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Verify →</button>
        </form>
      </div>
    </div>
  </main>
  <script src="/portal.js"></script>
  <script src="/patient-appointments.js"></script>
  <script>
    var P = window.DmaPatientAppts;
    var errEl = document.getElementById('error');
    var okEl = document.getElementById('success');
    var phoneForm = document.getElementById('phone-form');
    var otpForm = document.getElementById('otp-form');

    function showError(msg) {
      okEl.style.display = 'none';
      errEl.textContent = msg;
      errEl.style.display = 'block';
    }

    phoneForm.onsubmit = async function (e) {
      e.preventDefault();
      errEl.style.display = 'none';
      var phone = document.getElementById('phone').value.trim();
      var btn = phoneForm.querySelector('button');
      btn.disabled = true;
      try {
        var data = await P.requestOtp(phone);
        document.getElementById('subtitle').textContent = 'Enter the 6-digit code sent to ' + phone + '.';
        if (P.getSessionToken()) {
          phoneForm.style.display = 'none';
          otpForm.style.display = 'block';
        }
        okEl.textContent = data.message || 'If this number is registered, an OTP has been sent.';
        okEl.style.display = 'block';
      } catch (ex) {
        showError(ex.message);
      } finally {
        btn.disabled = false;
      }
    };

    otpForm.onsubmit = async function (e) {
      e.preventDefault();
      errEl.style.display = 'none';
      var otp = document.getElementById('otp').value.trim();
      var sessionToken = P.getSessionToken();
      if (!sessionToken) {
        showError('Session expired. Please enter your phone again.');
        otpForm.style.display = 'none';
        phoneForm.style.display = 'block';
        return;
      }
      var btn = otpForm.querySelector('button');
      btn.disabled = true;
      try {
        await P.verifyOtp(otp, sessionToken);
        location.href = '/my-appointments/?verified=1';
      } catch (ex) {
        showError(ex.message);
        btn.disabled = false;
      }
    };

    if (P.getSessionToken()) {
      document.getElementById('phone').value = P.getStoredPhone();
      document.getElementById('subtitle').textContent = 'Enter the 6-digit code sent to ' + P.getStoredPhone() + '.';
      phoneForm.style.display = 'none';
      otpForm.style.display = 'block';
    }
  </script>
</body>
</html>
