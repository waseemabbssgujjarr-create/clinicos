<!DOCTYPE html>
<html lang="en" class="dma-world-auth">
<head>
  <script>(function(){try{var r=document.documentElement;var c=r.className||"";var t;if(/\bdma-world-auth\b/.test(c))t="light";else if(/\bdma-world-public\b/.test(c))t="dark";else{t=localStorage.getItem("dma-theme");if(t!=="light"&&t!=="dark")t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}r.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platform Admin — Doctors My Agency</title>
  <link rel="icon" href="/media/landing/dma-insignia.png" type="image/png" />
  <link rel="stylesheet" href="/dma-design-system.css?v=58" />
</head>
<body>
  <div class="dma-auth">
    <aside class="dma-auth-visual">
      <a class="dma-pub-logo dma-pub-logo--img" href="/"><img class="dma-logo-white" src="/media/landing/dma-logo-white.png" alt="Doctors My Agency" width="220" height="64" /></a>
      <div>
        <h1>Doctors My Agency Control Center</h1>
        <p>Is the SaaS healthy, and are clinics operating?</p>
      </div>
      <div class="dma-auth-preview">
        <strong>Platform Admin</strong>
        <p>Super admin access — manage all clinics</p>
      </div>
    </aside>
    <main class="dma-auth-form">
      <p class="dma-hint"><a href="/start/">← Back to portal</a></p>
      <h2>Platform Admin</h2>
      <p class="dma-hint">Super admin access — manage all clinics</p>
      <div id="error" class="dma-alert" style="display:none;margin-bottom:12px"></div>
      <form id="form">
        <div class="dma-field">
          <label for="email">Admin Email</label>
          <input id="email" type="email" name="email" required placeholder="admin@doctorsmyagency.com" autocomplete="email" />
        </div>
        <div class="dma-field">
          <div class="dma-auth-row">
            <label for="password">Password</label>
            <a href="/forgot-password/?role=admin">Forgot password?</a>
          </div>
          <input id="password" type="password" name="password" required placeholder="Your admin password" autocomplete="current-password" />
        </div>
        <button type="submit" class="dma-btn dma-btn-primary">Access Admin Panel →</button>
      </form>
      <p class="dma-hint" style="text-align:center;margin-top:16px"><a href="/start/">Portal</a></p>
    </main>
  </div>
  <script src="/portal.js?v=8"></script>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const btn = e.target.querySelector('[type="submit"]');
      err.style.display = 'none';
      if (typeof setBtnLoading === 'function') setBtnLoading(btn, true, 'Signing in…');
      else { btn.disabled = true; btn.textContent = 'Signing in…'; }
      const fd = new FormData(e.target);
      try {
        const r = await fetch('/api/auth/superadmin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Invalid credentials');
        if (data.token && data.user) syncClinicosStore(data.user, data.token);
        window.location.href = '/superadmin/';
      } catch (ex) {
        err.innerHTML =
          (ex.message || 'Invalid credentials') +
          ' — Use <a href="/forgot-password/?role=admin">Forgot password</a> or run <code>reset-admin-password.php?key=DMA-SETUP-2026</code> once on the server.';
        err.style.display = 'block';
        if (typeof setBtnLoading === 'function') setBtnLoading(btn, false);
        else { btn.disabled = false; btn.textContent = 'Access Admin Panel →'; }
      }
    };
  </script>
</body>
</html>
