<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Doctors My Agency</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/landing.css" />
  <link rel="stylesheet" href="/portal.css?v=2" />
  <link rel="stylesheet" href="/platform-hovers.css" />
  <link rel="stylesheet" href="/dma-theme.css" />
  <script>
    (function(){try{var t=localStorage.getItem('dma-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(_){document.documentElement.setAttribute('data-theme','light');}})();
  </script>
</head>
<body class="portal-page">
  <div class="glow glow-blue"></div>
  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo" style="text-decoration:none;color:inherit"><div class="logo-icon">DM</div> Doctors My Agency</a>
    </div>
  </nav>
  <main class="portal-main">
    <div class="container">
      <a href="/doctor-login/" class="back-link">← Back to sign in</a>
      <div class="form-card">
        <h1>Set new password</h1>
        <p class="subtitle">Choose a strong password for your account.</p>

        <div id="error" class="alert alert-error" style="display:none"></div>
        <div id="success" class="alert alert-success" style="display:none"></div>

        <form id="form">
          <input type="hidden" name="token" id="token" />
          <div class="field">
            <label>New password</label>
            <div class="password-wrap">
              <input type="password" name="password" id="password" required minlength="8" placeholder="At least 8 characters" autocomplete="new-password" />
              <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" title="Show password">
                <svg class="icon-show" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label>Confirm password</label>
            <div class="password-wrap">
              <input type="password" name="confirm" id="confirm" required minlength="8" placeholder="Repeat password" autocomplete="new-password" />
              <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" title="Show password">
                <svg class="icon-show" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-hide" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Update Password →</button>
        </form>
      </div>
    </div>
  </main>
  <script src="/portal.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const email = params.get('email');
    document.getElementById('token').value = token || '';

    if (!token) {
      document.getElementById('error').textContent = 'Invalid reset link. Request a new one from the forgot password page.';
      document.getElementById('error').style.display = 'block';
      document.getElementById('form').style.display = 'none';
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      const ok = document.getElementById('success');
      err.style.display = 'none';
      ok.style.display = 'none';
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return;
      }
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || 'Reset failed');
        var loginUrl = data.loginUrl || '/doctor-login/';
        ok.innerHTML = (data.message || 'Password updated!') +
          ' <a href="' + loginUrl + '" style="color:#86efac;font-weight:700">Sign in now →</a>';
        ok.style.display = 'block';
        e.target.style.display = 'none';
      } catch (ex) {
        err.textContent = ex.message + (ex.message.includes('expired') ? ' <a href="/forgot-password/" style="color:#fca5a5">Request new link</a>' : '');
        err.style.display = 'block';
      }
    };
  </script>
</body>
</html>
