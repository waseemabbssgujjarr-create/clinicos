<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic — Doctors My Agency</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/landing.css" />
  <link rel="stylesheet" href="/portal.css" />
  <link rel="stylesheet" href="/patients-marketplace.css" />
  <link rel="stylesheet" href="/inner-chat.css" />
  <link rel="stylesheet" href="/dma-theme.css" />
  <script>
    (function(){try{var t=localStorage.getItem('dma-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}catch(_){}})();
  </script>
</head>
<body class="portal-page">
  <div class="glow glow-purple"></div>
  <nav>
    <div class="container nav-inner">
      <a href="/" class="logo" style="text-decoration:none;color:inherit"><div class="logo-icon">DM</div> Doctors My Agency</a>
      <div class="nav-cta">
        <a href="/my-appointments/" class="btn btn-outline">My Appointments</a>
      </div>
    </div>
  </nav>

  <main class="portal-main marketplace-main">
    <div class="clinic-detail-wrap">
      <a href="/" class="back-link">← Home</a>

      <div id="loading" style="text-align:center;padding:48px;color:var(--muted)">Loading clinic…</div>
      <div id="error" style="display:none;text-align:center;padding:48px;color:#fca5a5"></div>

      <div id="content" style="display:none">
        <header class="clinic-detail-header">
          <div class="clinic-detail-logo" id="logo">C</div>
          <div>
            <h1 id="clinic-name">—</h1>
            <div class="clinic-detail-info" id="clinic-info"></div>
            <div class="clinic-detail-cta">
              <a href="#" id="book-link" class="btn btn-primary">Book Appointment</a>
              <a href="tel:" id="phone-link" class="btn btn-outline" style="display:none">Call clinic</a>
            </div>
          </div>
        </header>

        <div class="clinic-detail-layout">
          <section class="clinic-doctors-panel">
            <h2 id="doctors-title">Doctors &amp; availability</h2>
            <div id="doctors-list"></div>
            <table class="hours-table" id="hours-table"></table>
          </section>

          <section class="clinic-chat-panel">
            <div id="chat"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="/inner-chat.js"></script>
  <script>
    (function () {
      function slugFromPath() {
        var parts = location.pathname.replace(/\/+$/, '').split('/');
        var last = parts[parts.length - 1];
        if (last === 'detail') return parts[parts.length - 2] || null;
        return /^[a-zA-Z0-9_-]+$/.test(last) ? last : null;
      }

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
      }

      var slug = slugFromPath();
      if (!slug) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Invalid clinic link.';
        return;
      }

      fetch('/api/public/clinics/' + encodeURIComponent(slug))
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          document.getElementById('loading').style.display = 'none';
          if (!res.ok) {
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = res.data.error || 'Clinic not found.';
            return;
          }
          var c = res.data;
          document.title = c.name + ' — Doctors My Agency';
          document.getElementById('content').style.display = 'block';

          var initial = (c.name || 'C').charAt(0).toUpperCase();
          var logoEl = document.getElementById('logo');
          if (c.logoUrl) {
            logoEl.innerHTML = '<img src="' + esc(c.logoUrl) + '" alt="" />';
          } else {
            logoEl.textContent = initial;
          }

          document.getElementById('clinic-name').textContent = c.name;
          var info = [];
          if (c.specialty) info.push('<strong>Specialty:</strong> ' + esc(c.specialty));
          if (c.address) info.push('<strong>Address:</strong> ' + esc(c.address));
          if (c.phone) info.push('<strong>Phone:</strong> ' + esc(c.phone));
          if (c.availability && c.availability.label) {
            info.push('<strong>Today:</strong> ' + esc(c.availability.label));
          }
          document.getElementById('clinic-info').innerHTML = info.join('<br />');

          document.getElementById('book-link').href = '/book/' + encodeURIComponent(c.bookingSlug || slug) + '/';
          if (c.phone) {
            var pl = document.getElementById('phone-link');
            pl.href = 'tel:' + c.phone.replace(/\s/g, '');
            pl.style.display = '';
          }

          var doctorsTitle = c.isMultiProvider ? 'Doctors & specialists' : 'Doctor & availability';
          document.getElementById('doctors-title').textContent = doctorsTitle;

          var doctors = c.doctors || [];
          document.getElementById('doctors-list').innerHTML = doctors.length
            ? doctors.map(function (d) {
                var di = (d.name || '?').charAt(0).toUpperCase();
                var wait = d.availabilityStatus !== 'available_today';
                return '<div class="doctor-row">' +
                  '<div class="doctor-avatar">' + esc(di) + '</div>' +
                  '<div class="doctor-info">' +
                    '<h4>' + esc(d.name) + (d.isPrimary ? ' <span style="color:#fb923c;font-size:0.7rem">Lead</span>' : '') + '</h4>' +
                    '<p>' + esc(d.role) + (d.specialty ? ' · ' + esc(d.specialty) : '') + '</p>' +
                    '<p style="font-size:0.72rem;margin-top:2px">' + esc(d.hoursToday || '') + '</p>' +
                    '<div class="doctor-avail' + (wait ? ' is-wait' : '') + '">' + esc(d.availability || '') + '</div>' +
                  '</div>' +
                '</div>';
              }).join('')
            : '<p style="color:var(--muted);font-size:0.875rem">Contact the clinic for provider details.</p>';

          var hours = c.hoursSummary || [];
          document.getElementById('hours-table').innerHTML = hours.map(function (h) {
            return '<tr><td>' + esc(h.label) + '</td><td>' + esc(h.hours) + '</td></tr>';
          }).join('');

          var intro = c.customIntroMsg || ('Hi! Welcome to ' + c.name + '. Ask about hours, treatments, doctor availability, or booking.');
          new DmaInnerChat('#chat', {
            title: c.name,
            subtitle: 'AI receptionist · ' + (c.specialty || 'Medical clinic'),
            apiUrl: '/api/public/clinics/' + encodeURIComponent(slug) + '/ai-chat',
            introMessage: intro,
            placeholder: 'Ask about doctors, hours, prices, or booking…',
          });
        })
        .catch(function () {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').style.display = 'block';
          document.getElementById('error').textContent = 'Could not load clinic. Please try again.';
        });
    })();
  </script>
</body>
</html>
