<!DOCTYPE html>
<html lang="en" class="sa-static">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Clinics — Doctors My Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dma-design-system.css?v=8" />
  <link rel="stylesheet" href="/superadmin-theme.css?v=10" />
</head>
<body class="superadmin-app">
  <div class="sa-layout">
    <aside class="sa-sidebar" id="sa-sidebar"></aside>
    <main class="sa-main">
      <div class="sa-content-card">
        <div class="ds-page-header">
          <div>
            <h1>Clinics</h1>
            <p>Search, inspect, and operate every clinic on the platform.</p>
          </div>
          <p class="sa-status" id="meta">Loading…</p>
        </div>
        <form class="ds-toolbar" id="filters">
          <input class="ds-input ds-search" id="q" type="search" placeholder="Search clinic, owner, or email" autocomplete="off" />
          <select class="ds-input" id="plan" aria-label="Plan">
            <option value="">All plans</option>
            <option value="TRIAL">Trial</option>
            <option value="STARTER">Starter</option>
            <option value="PRO">Pro</option>
            <option value="ENTERPRISE">Enterprise</option>
          </select>
          <select class="ds-input" id="status" aria-label="Status">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
          </select>
          <button type="submit" class="ds-btn ds-btn-primary">Filter</button>
        </form>
        <div id="state" class="ds-loading">Loading clinics…</div>
        <div class="ds-table-wrap ds-desktop-table">
          <table class="ds-table" id="table">
            <thead>
              <tr>
                <th data-sort="name">Clinic</th>
                <th data-sort="ownerName">Owner</th>
                <th>Contact</th>
                <th>WhatsApp</th>
                <th>AI</th>
                <th data-sort="patients">Patients</th>
                <th data-sort="appointments">Appointments</th>
                <th data-sort="plan">Subscription</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="ds-clinic-cards" id="cards"></div>
        <div class="ds-pager" id="pager"></div>
      </div>
    </main>
  </div>
  <script src="/superadmin-admin-shell.js?v=8"></script>
  <script src="/dma-ui.js?v=1"></script>
  <script src="/superadmin-clinics.js?v=1"></script>
</body>
</html>
