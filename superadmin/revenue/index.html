<!DOCTYPE html>
<html lang="en" class="sa-static">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Revenue — Doctors My Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dma-design-system.css?v=8" />
  <link rel="stylesheet" href="/superadmin-theme.css?v=10" />
</head>
<body class="superadmin-app">
  <div class="sa-layout">
    <aside class="sa-sidebar" id="sa-sidebar"></aside>
    <main class="sa-main">
      <div class="sa-content-card">
        <div class="ds-page-header">
          <div>
            <h1>Revenue</h1>
            <p>Estimated monthly revenue from active paid clinics. Stripe invoices remain the billing source of truth.</p>
          </div>
          <a class="ds-btn ds-btn-outline" href="/superadmin/stripe/">Stripe</a>
        </div>
        <div id="state" class="ds-loading">Loading revenue…</div>
        <div id="content" style="display:none">
          <div class="ds-kpis" id="kpis"></div>
          <div class="ds-table-wrap">
            <table class="ds-table">
              <thead><tr><th>Month</th><th>Estimated revenue</th></tr></thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <h2 style="font-size:0.9375rem;margin:24px 0 12px">Plan mix</h2>
          <div id="dist"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="/superadmin-admin-shell.js?v=8"></script>
  <script src="/dma-ui.js?v=1"></script>
  <script>
    (function () {
      if (!DmaAdminShell.initStaticPage('/superadmin/revenue/')) return;
      var esc = DmaUI.esc;
      DmaAdminShell.api('/api/superadmin/revenue').then(function (d) {
        var monthly = d.monthly || [];
        var dist = d.distribution || [];
        var last = monthly[monthly.length - 1] || {};
        document.getElementById('kpis').innerHTML =
          '<div class="ds-kpi"><div><label>This month (est.)</label><strong>$' + esc(last.estimatedRevenue || 0) + '</strong></div></div>' +
          '<div class="ds-kpi"><div><label>Months</label><strong>' + monthly.length + '</strong></div></div>';
        document.getElementById('tbody').innerHTML = monthly.map(function (m) {
          return '<tr><td>' + esc(m.month) + '</td><td>$' + esc(m.estimatedRevenue) + '</td></tr>';
        }).join('');
        document.getElementById('dist').innerHTML = dist.length
          ? '<table class="ds-table"><thead><tr><th>Plan</th><th>Clinics</th></tr></thead><tbody>' +
            dist.map(function (g) {
              return '<tr><td>' + esc(g.plan) + '</td><td>' + esc(g._count && g._count.plan) + '</td></tr>';
            }).join('') + '</tbody></table>'
          : '<p class="ds-empty">No plan distribution yet.</p>';
        document.getElementById('state').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      }).catch(function (err) {
        document.getElementById('state').className = 'ds-error';
        document.getElementById('state').textContent = err.message || 'Could not load revenue.';
      });
    })();
  </script>
</body>
</html>
