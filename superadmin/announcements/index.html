<!DOCTYPE html>
<html lang="en" class="sa-static">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Announcements — Doctors My Agency</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dma-design-system.css?v=8" />
  <link rel="stylesheet" href="/superadmin-theme.css?v=10" />
</head>
<body class="superadmin-app">
  <div class="sa-layout">
    <aside class="sa-sidebar" id="sa-sidebar"></aside>
    <main class="sa-main">
      <div class="sa-content-card">
        <div class="ds-page-header">
          <div>
            <h1>Announcements</h1>
            <p>Email every active clinic owner. Uses the platform SMTP integration.</p>
          </div>
        </div>
        <form id="form" class="dma-grid-2" style="display:grid;gap:16px;max-width:720px">
          <div class="dma-field" style="grid-column:1/-1">
            <label class="cos-label" for="subject">Subject</label>
            <input class="cos-input" id="subject" required maxlength="180" />
          </div>
          <div class="dma-field" style="grid-column:1/-1">
            <label class="cos-label" for="body">Message</label>
            <textarea class="cos-input area" id="body" rows="10" required></textarea>
          </div>
          <div>
            <button type="submit" class="ds-btn ds-btn-primary" id="send">Send to active clinics</button>
          </div>
        </form>
        <p class="cos-hint" id="result"></p>
      </div>
    </main>
  </div>
  <script src="/superadmin-admin-shell.js?v=8"></script>
  <script src="/dma-ui.js?v=1"></script>
  <script>
    (function () {
      if (!DmaAdminShell.initStaticPage('/superadmin/announcements/')) return;
      document.getElementById('form').onsubmit = function (e) {
        e.preventDefault();
        var btn = document.getElementById('send');
        btn.disabled = true;
        DmaAdminShell.api('/api/superadmin/announce', {
          method: 'POST',
          body: { subject: document.getElementById('subject').value, body: document.getElementById('body').value }
        }).then(function (d) {
          DmaUI.toast('Sent to ' + (d.sent || 0) + ' of ' + (d.total || 0), 'ok');
          document.getElementById('result').textContent = 'Sent ' + (d.sent || 0) + ' of ' + (d.total || 0) + ' clinics.';
        }).catch(function (err) {
          DmaUI.toast(err.message || 'Send failed', 'err');
        }).finally(function () { btn.disabled = false; });
      };
    })();
  </script>
</body>
</html>
